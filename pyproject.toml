[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-triage-agent"
version = "0.1.0"
description = "A real CI test-failure triage agent: prunes logs, reads only the failing code, caches its prompt prefix, and compacts old tool output."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.6"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
ci-triage-agent = "ci_triage_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["B008"]
